name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend

        env: 
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t bhagyajeet/expense-tracker-backend-ci-ga:latest ./backend

      - name: Build frontend Docker image
        run: docker build -t bhagyajeet/expense-tracker-frontend-ci-ga:latest ./frontend

      - name: Push backend image
        run: docker push bhagyajeet/expense-tracker-backend-ci-ga:latest

      - name: Push frontend image
        run: docker push bhagyajeet/expense-tracker-frontend-ci-ga:latest

 ###===============================================================

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted


    steps:
      - name: Checkout the code
        uses: actions/checkout@v4


      - name: Deploy Application
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps
